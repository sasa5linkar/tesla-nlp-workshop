[project]
name = "tesla-nlp-workshop"
version = "0.1.0"
description = "Lokalna radionica obrade srpskog jezika"
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
  "gradio==6.9.0",
  "spacy==3.8.11",
  "spacy-transformers==1.3.9",
  "transformers==4.49.0",
  "torch==2.7.1",
  "huggingface-hub==0.36.0",
  "sentencepiece==0.2.1",
  "safetensors==0.6.2",
  "psutil==7.2.2",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
